services:
  - type: web
    name: family-finance
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DASHBOARD_PASSWORD
        value: changeme123
    disk:
      name: db
      mountPath: /data
      sizeGB: 1
