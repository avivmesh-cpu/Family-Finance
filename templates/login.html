<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Finance — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card {
      width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 40px;
      text-align: center;
    }
    .login-logo {
      width: 64px; height: 64px;
      background: var(--accent);
      color: var(--bg);
      font-size: 32px;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-weight: 700;
    }
    .login-title {
      font-family: 'DM Serif Display', serif;
      font-size: 24px;
      margin-bottom: 6px;
    }
    .login-sub { color: var(--text3); font-size: 13px; margin-bottom: 32px; }
    .login-input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      text-align: center;
      letter-spacing: .1em;
      margin-bottom: 16px;
    }
    .login-input:focus { outline: none; border-color: var(--accent); }
    .login-btn {
      width: 100%;
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 12px;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .login-btn:hover { background: var(--accent2); }
    .login-error {
      background: var(--red-dim);
      border: 1px solid var(--red);
      color: var(--red);
      border-radius: var(--radius-sm);
      padding: 10px;
      font-size: 13px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">₪</div>
    <div class="login-title">Family Finance</div>
    <div class="login-sub">Enter your password to access the dashboard</div>
    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <input type="password" name="password" class="login-input"
             placeholder="••••••••" autofocus autocomplete="current-password" />
      <button type="submit" class="login-btn">Unlock Dashboard</button>
    </form>
  </div>
</body>
</html>
